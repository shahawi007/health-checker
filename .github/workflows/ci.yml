name: CI
on: 
  push:
    branches: [main]
jobs:
    build:
      runs-on: ubuntu-latest
      permissions: 
          contents: read
          packages: write
      steps:
        - name: checkout code
          uses: actions/checkout@v4 
        - name: Log in to GHCR
          uses: docker/login-action@v3
          with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
        - name: build docker image
          run: docker build -t ghcr.io/shahawi007/health-checker:latest .
        - name: push docker image
          run: docker push ghcr.io/shahawi007/health-checker:latest